name: banner

# Regenerates docs/assets/banner*.svg from repo-kit.toml and patches the
# dwgx-banner block in README.md. The generator is fetched from dwgx/DWGX at the
# commit pinned in repo-kit.lock.json and every file is checked against its
# sha256 before Python imports it (scripts/fetch-repokit.mjs). Upgrades come from
# there by updating the lock, which is reviewed like source.
#
# The schedule stays off until a manual run has been watched go green: a failing
# schedule means one email per repository, and a broken generator fails loudly.
#
# `branches: [master]` is load-bearing. GitHub ignores path filters for tag
# pushes, so without it every release tag ran this workflow on a detached HEAD
# and died at `git push`; it also keeps repo-kit.toml edits on side branches from
# pushing bot commits. Only master pushes that touch repo-kit.toml and manual
# dispatches render the banner.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "repo-kit.toml"

permissions:
  contents: write

concurrency:
  group: banner
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: fetch and verify generator
        run: |
          set -euo pipefail
          # The lock pins the commit and every sha256; this writes nothing unless
          # all four files match, so a mismatch fails here and render never runs.
          node scripts/fetch-repokit.mjs --dest /tmp/repokit
          test -s /tmp/repokit/build.py
          test -s /tmp/repokit/styles.py
          test -s /tmp/repokit/styles_ink.py
          test -s /tmp/repokit/ink.py
          python -c "import sys; sys.path.insert(0,'/tmp/repokit'); import build; print('generator ok, theme', build.THEME)"

      - name: render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python /tmp/repokit/build.py "${GITHUB_REPOSITORY#*/}" \
            --toml repo-kit.toml --out . --flat --inject

      - name: commit
        if: github.ref_type == 'branch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/assets
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: refresh banner"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push