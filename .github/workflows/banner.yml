name: banner

# Regenerates docs/assets/banner*.svg from repo-kit.toml and patches the
# dwgx-banner block in README.md. The generator is fetched from dwgx/DWGX at run
# time, so this repository keeps no copy of it and upgrades come from there.
#
# The schedule stays off until a manual run has been watched go green: a failing
# schedule means one email per repository, and a broken generator fails loudly.
#
# `branches: [master]` is load-bearing. GitHub ignores path filters for tag
# pushes, so without it every release tag ran this workflow on a detached HEAD
# and died at `git push`; it also keeps repo-kit.toml edits on side branches from
# pushing bot commits. Only master pushes that touch repo-kit.toml and manual
# dispatches render the banner.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "repo-kit.toml"

permissions:
  contents: write

concurrency:
  group: banner
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fetch generator
        run: |
          set -euo pipefail
          mkdir -p /tmp/repokit
          base=https://raw.githubusercontent.com/dwgx/DWGX/main/repo-kit
          for f in build.py styles.py styles_ink.py ink.py; do
            curl -fsSL -o "/tmp/repokit/$f" "$base/$f"
          done
          # fail here, not three steps later, if a file is missing
          test -s /tmp/repokit/build.py
          test -s /tmp/repokit/styles_ink.py
          test -s /tmp/repokit/ink.py
          python -c "import sys; sys.path.insert(0,'/tmp/repokit'); import build; print('generator ok, theme', build.THEME)"

      - name: render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python /tmp/repokit/build.py "${GITHUB_REPOSITORY#*/}" \
            --toml repo-kit.toml --out . --flat --inject

      - name: commit
        if: github.ref_type == 'branch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/assets
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: refresh banner"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push