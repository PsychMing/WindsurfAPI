name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # 506 files / ~6,250 tests: measured 10m+ on a hosted runner. The old 10-minute
    # cap cancelled v3.9.58 mid-suite; 20 leaves headroom without hiding a hang.
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The wire comparison base is a tag, so the tags have to be here.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Verify tag matches package version
        run: node scripts/verify-release-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Select the release baseline (strict ancestor, recorded)
        # Without this the suite skipped the byte comparison and said so only in the log,
        # so a release could pass with no wire evidence at all; a sibling CI job on the
        # same SHA had run it, which is a coincidence, not a gate. Same selector as the
        # CI wire job: the newest ANNOTATED release tag that is a strict ancestor, no
        # lightweight fallback, refusing a self-comparison.
        run: |
          node scripts/wire-base.mjs
          BASE_TAG=$(node scripts/wire-base.mjs --field tag)
          BASE_SHA=$(node scripts/wire-base.mjs --field sha)
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$BASE_SHA" = "$HEAD_SHA" ]; then
            echo "::error::refusing to compare $HEAD_SHA against itself"
            exit 1
          fi
          git worktree add --detach "$RUNNER_TEMP/wire-base" "$BASE_SHA"
          echo "comparing $HEAD_SHA against $BASE_SHA ($BASE_TAG)"
          echo "WIRE_BASE_TREE=$RUNNER_TEMP/wire-base" >> "$GITHUB_ENV"
          echo "WIRE_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "WIRE_BASE_TAG=$BASE_TAG" >> "$GITHUB_ENV"
          echo "WIRE_BASE_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Secret scan
        run: npm run secret-scan

      - name: Mutation baselines match, measured from executed evidence (full scope)
        # FULL scope on purpose: a tag checkout has no diff to scope by, and a
        # change-scoped run would measure nothing (or exit 2 on the missing
        # origin/master). Every spec is executed against its own pin here, which is
        # the only mode that catches a pin moved by a change no spec's test list
        # names. The incremental `npm run gate` stays fast with change-scoped
        # selection; this is the gate that cannot be scoped.
        run: node scripts/spec-baseline-check.mjs --all

      - name: Run tests
        run: npm run test:release

  docker:
    name: Docker Build & Push
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build metadata
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT_DATE=$(git log -1 --pretty=%cI)" >> "$GITHUB_ENV"
          echo "BUILD_BRANCH=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          {
            echo "COMMIT_MESSAGE<<EOF"
            git log -1 --pretty=%s
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # github.repository (= dwgx/WindsurfAPI) lowercases to "windsurfapi"
          # without the hyphen the package.json npm name uses. Hardcode the
          # kebab form so the image name stays "windsurf-api".
          images: ghcr.io/${{ github.repository_owner }}/windsurf-api
          tags: |
            # Only tag as latest for stable releases (no pre-release suffix like -rc, -alpha, -beta)
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            # v2.0.6 -> 2.0.6
            type=semver,pattern={{version}}
            # v2.0.6 -> 2.0
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ env.VERSION }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_COMMIT_MESSAGE=${{ env.COMMIT_MESSAGE }}
            BUILD_COMMIT_DATE=${{ env.COMMIT_DATE }}
            BUILD_BRANCH=${{ env.BUILD_BRANCH }}

      - name: Summary
        run: |
          echo "## Docker Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags:**" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' | tr ',' '\n' | sed 's/^/- `/' | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platform:** \`linux/amd64\`" >> "$GITHUB_STEP_SUMMARY"

  macos-exe-arm64:
    name: macOS single-binary (arm64)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build windsurfapi-macos-arm64
        run: |
          npm i -g @yao-pkg/pkg@6.21.0 esbuild@0.28.1
          npm run build:bundle
          mkdir -p dist-macos
          pkg src/_bundle.cjs --config package.json --targets node22-macos-arm64 --output dist-macos/windsurfapi-macos-arm64

      - name: Smoke-check the binary boots
        run: node scripts/exe-boot-smoke.mjs dist-macos/windsurfapi-macos-arm64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: windsurfapi-macos-arm64
          path: dist-macos/windsurfapi-macos-arm64
          if-no-files-found: error

  # Use an explicit Intel label so the x64 build does not move to ARM.
  # It is NOT in the release `needs`, so a failed or delayed x64 build never
  # blocks the release. If it finishes in time its artifact is picked up;
  # otherwise the release ships without the x64 binary.
  macos-exe-x64:
    name: macOS single-binary (x64 — non-blocking)
    needs: test
    runs-on: macos-26-intel
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build windsurfapi-macos-x64
        run: |
          npm i -g @yao-pkg/pkg@6.21.0 esbuild@0.28.1
          npm run build:bundle
          mkdir -p dist-macos
          pkg src/_bundle.cjs --config package.json --targets node22-macos-x64 --output dist-macos/windsurfapi-macos-x64

      - name: Smoke-check the binary boots
        run: node scripts/exe-boot-smoke.mjs dist-macos/windsurfapi-macos-x64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: windsurfapi-macos-x64
          path: dist-macos/windsurfapi-macos-x64
          if-no-files-found: error

  windows-exe:
    name: Windows single-exe
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Match the pkg target (node22-win-x64). pkg-fetch 3.6.4 ships prebuilt
          # base binaries for node22/24/26 but NOT node20 — a node20 target 404s
          # then falls back to compiling Node from source (no VS toolchain on the
          # runner → fails). node22 is LTS and has multiple prebuilts.
          node-version: '22'

      # Build the single .exe. pkg can't ingest our ESM tree directly:
      # package.json has "type":"module", so pkg loads each src/*.js as ESM but
      # its bytecode/fallback path emits CommonJS (module.exports) → "module is
      # not defined in ES module scope" at boot (seen in rc1/rc2). Fix: esbuild
      # first bundles the whole ESM graph into ONE CommonJS file (src/_bundle.cjs)
      # — no per-file ESM/CJS ambiguity — then pkg wraps that single CJS file.
      # The bundle keeps import.meta.url meaningful via a banner shim
      # (pathToFileURL(__filename)), so config.js/server.js/devin-connect-models
      # still resolve dashboard/ + data/ relative to the bundle; pkg's `assets`
      # (in package.json) map those files into the snapshot at the same paths.
      # The Windows runner has the network to fetch pkg's node22 base binary
      # (node20 has none → don't use it). Zero runtime deps, so no `npm ci`.
      - name: Build windsurfapi.exe
        run: |
          npm i -g @yao-pkg/pkg@6.21.0 esbuild@0.28.1
          npm run build:bundle
          pkg src/_bundle.cjs --config package.json --targets node22-win-x64 --output dist-windows/windsurfapi.exe

      - name: Smoke-check /health identity and /dashboard assets
        run: node scripts/exe-boot-smoke.mjs dist-windows/windsurfapi.exe

      # Assemble the "解压即用" zip: the exe + the tray launcher scripts + icon,
      # all in ONE flat folder. tray.ps1 auto-detects the sibling windsurfapi.exe
      # and switches to EXE mode (no Node, no source tree). Double-click tray.vbs
      # → system-tray icon; or double-click windsurfapi.exe → console window.
      # Both are zero-dependency (the exe carries its own Node runtime).
      - name: Package Windows zip (exe + tray)
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP\wa-zip"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item dist-windows\windsurfapi.exe $stage\
          Copy-Item deploy\windows\tray.vbs      $stage\
          Copy-Item deploy\windows\tray.ps1      $stage\
          Copy-Item deploy\windows\tray.bat      $stage\
          Copy-Item deploy\windows\windsurfapi.ico $stage\ -ErrorAction SilentlyContinue
          $readme = @(
            'WindsurfAPI - Windows 免安装分发包',
            '====================================',
            '',
            '两种启动方式（都无需安装 Node.js、无需源码）：',
            '',
            '1) 系统托盘（推荐）：双击 tray.vbs',
            '   -> 右下角系统匣出现图标，右键可【打开面板 / 复制面板密码 /',
            '      复制 API Key / 状态 / 重启 / 退出】。无黑窗。',
            '',
            '2) 控制台：双击 windsurfapi.exe',
            '   -> 弹出一个控制台窗口显示日志。',
            '',
            '首次启动会自动生成 API_KEY 与 DASHBOARD_PASSWORD 并写入本目录的',
            '.env，同时自动打开后台面板 http://127.0.0.1:3003/dashboard 。',
            '在面板里贴上 Devin session token 即可上号，其余免配置。',
            '',
            '默认仅本机访问（HOST=127.0.0.1）。要对外提供服务，编辑 .env 把',
            'HOST 改成 0.0.0.0 并保留一个强 API_KEY。'
          ) -join "`r`n"
          Set-Content -Path "$stage\启动说明.txt" -Value $readme -Encoding UTF8
          $zipPath = "$PWD\dist-windows\windsurfapi-windows.zip"
          Get-ChildItem -Path $stage | Compress-Archive -DestinationPath $zipPath -Force
          Write-Host "--- zip contents ---"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zr = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          $have = $zr.Entries.FullName
          $have | ForEach-Object { Write-Host $_ }
          $zr.Dispose()
          $must = @('windsurfapi.exe','tray.vbs','tray.ps1','tray.bat')
          foreach ($m in $must) { if ($have -notcontains $m) { Write-Error "zip missing $m"; exit 1 } }
          Write-Host 'zip OK: exe + tray scripts present'

      - name: Upload exe artifact
        uses: actions/upload-artifact@v6
        with:
          name: windsurfapi-windows-exe
          path: |
            dist-windows/windsurfapi.exe
            dist-windows/windsurfapi-windows.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [docker, windows-exe, macos-exe-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # SEC-04: keyless cosign signing exchanges this job's GitHub OIDC token
      # for a short-lived Fulcio certificate. No repository secret or private
      # key is involved; without this permission the signing step fails closed.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check for release notes
        id: notes
        run: |
          NEW_PATH="docs/releases/RELEASE_NOTES_${{ steps.version.outputs.VERSION }}.md"
          OLD_PATH="RELEASE_NOTES_${{ steps.version.outputs.VERSION }}.md"
          if [[ -f "$NEW_PATH" ]]; then
            echo "file=$NEW_PATH" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [[ -f "$OLD_PATH" ]]; then
            echo "file=$OLD_PATH" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Windows exe
        uses: actions/download-artifact@v7
        with:
          name: windsurfapi-windows-exe
          path: dist-windows

      - name: Download macOS arm64 binary
        uses: actions/download-artifact@v7
        with:
          name: windsurfapi-macos-arm64
          path: dist-macos

      - name: Download macOS x64 binary (optional)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: windsurfapi-macos-x64
          path: dist-macos

      - name: Package macOS zip (arm64 + scripts; x64 included if available)
        run: |
          chmod +x dist-macos/windsurfapi-macos-arm64
          [ -f dist-macos/windsurfapi-macos-x64 ] && chmod +x dist-macos/windsurfapi-macos-x64 || true
          cp deploy/macos/run.sh dist-macos/
          cp deploy/macos/run-background.sh dist-macos/
          cp deploy/macos/stop.sh dist-macos/
          cp deploy/macos/install-launchd.sh dist-macos/
          cp deploy/macos/uninstall-launchd.sh dist-macos/
          cp deploy/macos/README.md dist-macos/
          chmod +x dist-macos/*.sh
          cd dist-macos && zip -r ../windsurfapi-macos.zip . && cd ..
          echo "macOS zip contents:"; unzip -l windsurfapi-macos.zip

      - name: Generate SHA256SUMS for the published assets
        # SEC-04: releases used to ship unsigned, unhashed binaries, so a
        # tampered download was indistinguishable from a real one. Hash exactly
        # the files listed in the release `files:` block below; a missing file
        # fails the job rather than publishing a partial manifest.
        #
        # The manifest must name the assets as they appear on the release page
        # (flat), not their build-tree paths: GitHub release assets have no
        # directories, so `sha256sum -c SHA256SUMS` in a flat download folder
        # failed for every asset that carried a `dist-*/` prefix (v3.9.53, the
        # first release with a manifest). The subshells keep the build layout
        # while flattening names.
        run: |
          ( cd dist-windows && sha256sum windsurfapi.exe windsurfapi-windows.zip ) > SHA256SUMS
          ( cd dist-macos && sha256sum windsurfapi-macos-arm64 ) >> SHA256SUMS
          sha256sum windsurfapi-macos.zip >> SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        # SEC-04/SEC-11: the signer is pinned by commit SHA (the tag is mutable)
        # and to an exact cosign release, so the tool that produces the
        # signatures cannot change under a release without a visible commit.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'

      - name: Sign the published assets and SHA256SUMS (keyless)
        # SEC-04: SHA256SUMS alone is only an integrity check — it ships in the
        # same release as the binaries, so whoever can rewrite the release can
        # rewrite both. Sign every published blob with the workflow's GitHub
        # OIDC identity (no key, no secret) and publish:
        #   *.sig             detached signature
        #   *.pem             Fulcio certificate carrying the workflow identity
        #   *.sigstore.json   Sigstore bundle (cert + Rekor inclusion proof)
        # The bundle is the durable proof: Fulcio certificates expire in
        # minutes, and a detached certificate can only be checked against the
        # current time. Verification instructions live in docs/RELEASE-SIGNING.md.
        #
        # Any signing failure fails this job. A release that claims signatures
        # in its notes but ships none is worse than an explicitly unsigned one.
        run: |
          set -euo pipefail
          for f in \
            dist-windows/windsurfapi.exe \
            dist-windows/windsurfapi-windows.zip \
            dist-macos/windsurfapi-macos-arm64 \
            windsurfapi-macos.zip \
            SHA256SUMS; do
            base="$(basename "$f")"
            cosign sign-blob \
              --yes \
              --bundle "${base}.sigstore.json" \
              "$f"
          done
          # A missing or empty signature would otherwise be attached as a
          # zero-byte asset and only discovered by the first user to verify.
          for f in *.sigstore.json; do
            [ -s "$f" ] || { echo "::error::signature bundle $f is empty"; exit 1; }
          done
          ls -l *.sigstore.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.VERSION }}
          body_path: ${{ steps.notes.outputs.found == 'true' && steps.notes.outputs.file || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            *.sig
            *.pem
            *.sigstore.json
            dist-windows/windsurfapi.exe
            dist-windows/windsurfapi-windows.zip
            dist-macos/windsurfapi-macos-arm64
            windsurfapi-macos.zip
            SHA256SUMS
